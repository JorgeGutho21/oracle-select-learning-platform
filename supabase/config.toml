# Entorno local de Supabase para DB LAB (supabase start). Reproduce lo que la aplicación
# necesita del proyecto remoto: base de datos con las migraciones, Auth, API REST, Realtime
# (aviso de la sala en vivo) y un buzón de pruebas para los correos. Ningún secreto vive
# aquí: los valores sensibles se leen de variables de entorno con env(...).
# Configuración del proyecto remoto: docs/AUTH_ARCHITECTURE.md.
project_id = "db-lab"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Debe coincidir con la versión del proyecto remoto (SHOW server_version;).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Sin datos de ejemplo: las cuentas de prueba las crean las pruebas.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Buzón local (Mailpit): los correos de confirmación y recuperación se ven en
# http://127.0.0.1:54324 y nunca salen de la máquina.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
# Dirección pública de la aplicación: base de los enlaces de los correos.
site_url = "http://127.0.0.1:3000"
# Únicos destinos admitidos después de iniciar sesión (lista exacta o con comodín de ruta).
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3200/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30
token_refresh = 150
sign_in_sign_ups = 300
token_verifications = 300

[auth.email]
enable_signup = true
double_confirm_changes = true
# La cuenta se activa al confirmar el correo: así un correo institucional queda verificado.
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Plantillas en español con enlace de token (token_hash): la confirmación funciona aunque
# el correo se abra en otro dispositivo. El proyecto remoto necesita las mismas plantillas.
[auth.email.template.confirmation]
subject = "Confirma tu cuenta de DB LAB"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña de DB LAB"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirma tu nuevo correo en DB LAB"
content_path = "./supabase/templates/email_change.html"

[auth.sms]
enable_signup = false

# Microsoft (cuentas personales e institucionales). Desactivado por defecto: para probarlo
# en local, registra la aplicación en Microsoft Entra, exporta las variables y cambia
# enabled a true. La URL decide qué cuentas entran: .../common/v2.0 (personales y de
# organización) o .../<id-del-inquilino>/v2.0 (solo la institución).
[auth.external.azure]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
redirect_uri = ""
url = "https://login.microsoftonline.com/common/v2.0"
skip_nonce_check = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
